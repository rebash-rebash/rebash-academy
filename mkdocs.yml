# REBASH Academy – MkDocs Configuration

site_name: REBASH Academy
site_description: Learn by Building. Learning paths and hands-on tutorials for Cloud, DevOps, Kubernetes, and Platform Engineering.
site_author: Shaik Basha
site_url: https://rebash.in/

exclude_docs: |
  includes/*
  _curriculum/**

copyright: Copyright &copy; 2026 REBASH Academy

extra:
  hero:
    tagline: Learn by Building.
    description: Hands-on tutorials for Linux, Cloud, Kubernetes, Terraform, DevSecOps, and more.
  social_image: assets/images/og-default.png
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rebash-rebash
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/shaikkhadarbasha/
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@re-bash
    - icon: fontawesome/brands/x-twitter
      link: "#"
  analytics:
    provider: google
    property: G-2N59X0856S
  adsense:
    client: ca-pub-8933118209357814
  consent:
    title: Cookie consent
    description: >-
      We use cookies for Google Analytics and Google AdSense to measure traffic,
      improve tutorials, and fund free learning content. See our
      <a href="/legal/privacy-policy/">Privacy Policy</a>. You can accept, reject,
      or manage cookies below.
    cookies:
      analytics: Google Analytics
      adsense: Google AdSense
    actions:
      - accept
      - reject
      - manage
  generator: false
  giscus:
    repo: ""
    repo_id: ""
    category: General
    category_id: ""
  robots: |
    User-agent: *
    Allow: /
    Disallow: /azure/
    Disallow: /prometheus/
    Disallow: /grafana/
    Disallow: /loki/
    Disallow: /tempo/
    Disallow: /opentelemetry/
    Disallow: /devsecops/
    Disallow: /platform-engineering/
    Disallow: /sre/
    Disallow: /architecture/
    Disallow: /monitoring/
    Disallow: /security/
    Disallow: /community/
    Disallow: /youtube/
    Disallow: /capstones/
    Disallow: /certifications/
    Disallow: /career-paths/
    Sitemap: https://rebash.in/sitemap.xml
  # Free book downloads — set ONE of these so registrations are emailed to you:
  # Formspree: https://formspree.io (create a form, paste the form id, e.g. xyzabcde)
  # Web3Forms: https://web3forms.com (paste the access key)
  books:
    formspree_form_id: ""
    web3forms_access_key: "5ff050ad-3b50-4390-82fa-c4718f60b5d4"
  # Google Forms contact embed — paste the "Send → <> Embed" src URL
  # e.g. https://docs.google.com/forms/d/e/FORM_ID/viewform?embedded=true
  contact:
    google_form_embed: "https://docs.google.com/forms/d/e/1FAIpQLScAWV7_ISqxFCwUJoZ1KF0J0wB5JOQv6azR_oRAg3i-mxTT7w/viewform?embedded=true"

extra_css:
  - assets/stylesheets/custom.css

extra_javascript:
  - assets/javascripts/custom.js
  - assets/javascripts/books.js
  - assets/javascripts/quiz.js

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/images/logo.svg
  favicon: assets/images/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.tooltips
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()/`]+'
      lang: en
  - awesome-pages
  - minify:
      minify_html: true
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
  - open-in-new-tab:
      add_icon: true
  - macros:
      include_dir: docs/includes
      on_error_fail: false

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - meta
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      title: On this page
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

hooks:
  - hooks/publish_gate.py
  - hooks/on_env.py
  - hooks/render_d2_svg.py

watch:
  - overrides
  - theme
  - hooks

strict: true
