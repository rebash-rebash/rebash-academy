linux:
  icon: linux
  theme: linux
  eyebrow: Foundations course
  tagline: Master Linux from the ground up — from fundamentals to production operations for cloud and DevOps teams.
  build_summary: Configure services, harden SSH, automate admin tasks, and troubleshoot real production Linux systems.
  learning_outcomes:
    - Navigate the Linux filesystem and manage files efficiently
    - Manage users, groups, permissions, and sudo access
    - Configure networking, SSH, and basic firewalls
    - Monitor processes, logs, and system performance
    - Package management and service configuration with systemd
    - Container fundamentals and production hardening patterns
  related: [shell, python, networking, docker]
  career_paths: [devops-engineer, linux-administrator, cloud-engineer, site-reliability-engineer]
  labs: 10
  quizzes: 1
  projects: 2
  capstones: 1
  cheatsheets: 1
  interview: 1
  certifications: [RHCSA, LFCS, RHCE]

